return"<h2>Достижения и награды</h2>"+A.map(function(a){var ok=a[2]>=a[3];return'<div class="hab'+(ok?" on":"")+'" style="align-items:flex-start"><span class="ck">'+(ok?"✓":"")+'</span><span class="t">'+a[1]+"<small>"+Math.min(Math.floor(a[2]),a[3])+" / "+a[3]+"</small>"+fld("prizes."+a[0],S.prizes[a[0]]||"",0,"Моя награда")+"</span></div>"}).join("")}
var TABS=[["home","Главная"],["diary","Дневник"],["rev","Разбор"],["sport","Спорт"],["books","Книги"],["fin","Финансы"]];
var BQ="";
function bsearch(){var q=BQ.trim().toLowerCase(),n=0;document.querySelectorAll("details.bk").forEach(function(e){var m=!q||e.dataset.q.indexOf(q)>-1;e.style.display=m?"":"none";if(m&&q)n++});document.querySelectorAll("details[data-cat]").forEach(function(c){var v=c.querySelectorAll('details.bk:not([style*="none"])').length;c.style.display=v?"":"none";if(q&&v){c.open=true;OP[c.dataset.id]=true}});var s=document.getElementById("bsn");if(s)s.textContent=q?"Найдено: "+n:""}
document.addEventListener("input",function(e){if(e.target.id=="bs"){BQ=e.target.value;bsearch()}});
function draw(){var y=scrollY;S.debt.now=String(dnow());document.getElementById("app").innerHTML={home:home,diary:diary,rev:review,sport:sport,books:books,fin:fin}[S.tab]();
document.getElementById("nav").innerHTML='<div class="brand serif">2000<b>$</b></div>'+TABS.map(function(t){return'<button data-a="tab:'+t[0]+'" class="'+(S.tab==t[0]?"act":"")+'">'+t[1]+"</button>"}).join("");scrollTo(0,y);if(S.tab=="books")bsearch()}
function setp(path,v){var p=path.split("."),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
function gv(id){return document.getElementById(id).value.trim()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a.split(":"),c=a[0],v=a[1];
if(c=="tab"){S.tab=v;scrollTo(0,0)}
else if(c=="gd")ensure().gd=!ensure().gd;
else if(c=="sleep")ensure().sleep=!ensure().sleep;
else if(c=="min")ensure().min=Math.max(0,ensure().min+ +v);
else if(c=="dclose")S.debts[+v].left=0;
else if(c=="deldebt"){if(confirm("Убрать долг из списка?"))S.debts.splice(+v,1);else return}
else if(c=="adddebt"){if(!gv("d_n")||!gv("d_s")){alert("Укажи название и остаток");return}S.debts.push({n:gv("d_n"),left:+gv("d_s")||0})}
else if(c=="bkshow"){document.getElementById("bk_json").value=JSON.stringify(S);return}
else if(c=="bkload"){try{var bo=JSON.parse(document.getElementById("bk_json").value);if(!bo||typeof bo!="object")throw 0;if(!confirm("Заменить данные на этом устройстве?"))return;S=Object.assign(S,bo)}catch(e){alert("Не удалось прочитать данные");return}}
else if(c=="addtrade"){if(!gv("t_ins")||!gv("t_dt")){alert("Укажи дату и инструмент");return}
var ok=gv("t_ok"),why=gv("t_why"),dd=gv("t_dt").slice(0,10),sd=S.trades.filter(function(t){return t.dt.slice(0,10)==dd}),ov=[];
if(sd.length>=2)ov.push("лимит 2 сделки за сессию");
if(sd.some(function(t){return t.ins.toLowerCase()==gv("t_ins").toLowerCase()}))ov.push("вторая сделка по инструменту");
if(ov.length){if(!confirm("Нарушение правил: "+ov.join(", ")+". Записать сделку как нарушение?"))return;ok="нет";why=(why?why+"; ":"")+ov.join("; ")}
if(ok=="нет"&&!why){alert("Если правила нарушены, напиши почему");return}
S.trades.push({dt:gv("t_dt"),ins:gv("t_ins"),dir:gv("t_dir"),news:gv("t_news"),rusd:gv("t_rusd"),rpct:gv("t_rpct"),r:gv("t_r"),in:gv("t_in"),sl:gv("t_sl"),tp:gv("t_tp"),res:gv("t_res"),ok:ok,why:why,emo:gv("t_emo")})}
else if(c=="deltrade"){if(confirm("Удалить сделку?"))S.trades.splice(+v,1);else return}
else if(c=="addbook"){if(!gv("bk_t")){alert("Укажи название");return}S.books.push({id:"u"+Date.now(),t:gv("bk_t"),a:gv("bk_a"),c:gv("bk_c"),st:"plan",read:"",total:"",mind:"",rules:"",cons:"",skills:"",int:""})}
else if(c=="delbook"){if(confirm("Убрать книгу из списка?"))S.books.splice(+v,1);else return}
else if(c=="addgoal"){if(!gv("g_n")){alert("Укажи название цели");return}S.goals.push({n:gv("g_n"),k:gv("g_k"),s:gv("g_s"),d:false})}
else if(c=="sp"){if(!S.sport[v])S.sport[v]={};S.sport[v].done=!S.sport[v].done}
else if(c=="gt")S.goals[+v].d=!S.goals[+v].d;
else if(c=="delgoal"){if(confirm("Убрать цель?"))S.goals.splice(+v,1);else return}
save();draw()});
document.addEventListener("change",function(e){var p=e.target.dataset&&e.target.dataset.set;if(!p)return;
if(/^days\./.test(p))ensure();var m=p.match(/^(rev|sport)\.([^.]+)\./);if(m&&!S[m[1]][m[2]])S[m[1]][m[2]]={};setp(p,e.target.value);save();if(/^books\.\d+\.(mind|rules|cons|skills|int)$/.test(p)||/^(rev|sport|prizes)\./.test(p)||p=="ch.note")return;draw()});
document.addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.id)OP[d.dataset.id]=d.open},true);
draw();
</script>
