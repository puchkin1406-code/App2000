<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--card:#1a1411;--line:#33261d;--tx:#f3ece6;--mu:#9a8b80;--o:#7ed6c4;--o2:#ffb27a;--ok:#6fcf97;--bad:#e5625a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--tx);font:400 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg) radial-gradient(900px 520px at 75% -8%,rgba(126,214,196,.28),transparent 70%) no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(13,10,8,.92);z-index:9}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(13,10,8,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:10px 14px;overflow-x:auto}
.brand{font-size:26px;margin-right:auto;white-space:nowrap}.brand b{color:var(--o);font-weight:400}
nav button{background:none;border:1px solid transparent;border-radius:14px;padding:8px 14px;color:var(--mu);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.act{color:var(--o2);background:rgba(126,214,196,.14);border-color:rgba(126,214,196,.4)}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
@media(min-width:900px){.shell{display:grid;grid-template-columns:230px 1fr;align-items:start}
nav{flex-direction:column;align-items:stretch;height:calc(100vh - env(safe-area-inset-top,0px));border-bottom:0;border-right:1px solid var(--line);padding:24px 14px;overflow:visible}
.brand{font-size:34px;margin:0 0 18px 8px}nav button{text-align:left;padding:12px 14px;font-size:16px}main{max-width:760px;padding:32px 32px 60px}}
h1{font-size:30px;margin:0;font-weight:400}
h2{font-size:13px;margin:26px 0 10px;color:var(--mu);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
.card{background:linear-gradient(160deg,rgba(126,214,196,.09),rgba(255,255,255,.02) 60%),var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.hero{border-color:rgba(126,214,196,.35)}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.chip{border:1px solid rgba(126,214,196,.5);color:var(--o2);border-radius:999px;padding:5px 12px;font-size:14px;background:rgba(126,214,196,.1);white-space:nowrap}
.num{font-size:64px;line-height:1}.num small{font-size:28px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px}.tile .num{font-size:40px}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:9px 11px;font:inherit;font-size:15px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--o);outline-offset:1px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--o);color:#1a0d04;border:0;border-radius:14px;padding:12px 16px;font-weight:700;width:100%;margin-top:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mu);font-size:14px}
.hab{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:linear-gradient(160deg,rgba(126,214,196,.1),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.hab.on{border-color:rgba(126,214,196,.5);background:rgba(126,214,196,.14)}.hab.on .t{color:var(--mu);text-decoration:line-through}
.hab .t{flex:1;font-weight:700}.hab .t small{display:block;font-weight:400;color:var(--mu);text-decoration:none}
.ck{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid #4a382b;display:grid;place-items:center;color:#1a0d04;font-weight:700}.on .ck{background:var(--o);border-color:var(--o)}
